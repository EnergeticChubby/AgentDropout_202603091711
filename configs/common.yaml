model:
  name: qwen3-8b
  provider: openai_compatible
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY

benchmark:
  dataset: edinburgh-dawg/mmlu-redux
  split: test
  num_shards: 8
  shard_strategy: contiguous
  seeds: [11, 22, 33]

logging:
  output_root: artifacts/runs
  save_events: true
  save_predictions: true
  save_failures: true
